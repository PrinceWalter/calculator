<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>
/* The app passes the phone's light/dark setting in the address so colours match from the first frame */
try { var t = new URLSearchParams(location.search).get("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<title>Long Tape Calculator</title>
<style>
@font-face{font-family:"Roboto";font-weight:300;font-style:normal;font-display:swap;src:url("fonts/roboto-latin-300-normal.woff2") format("woff2")}
@font-face{font-family:"Roboto";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/roboto-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Roboto";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/roboto-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-700-normal.woff2") format("woff2")}
*{box-sizing:border-box}
body{margin:0;font-size:14px}
/* Layout: icon bar, expression + live result, round 4-column keypad; history takes the left three columns beside the operators. */
:root{
  --bg:#f4f6f5; --key:#e3e8e6; --key2:#d4dcd9; --fg:#121a18; --muted:#6b7975; --line:#cfd8d5;
  --accent:#17866d; --accent-fg:#ffffff; --danger:#d0483c;
  --b0:#17866d; --b1:#121a18; --b2:#b7791f;
  --gap:15px;
  --f-num:"Roboto", "Segoe UI", system-ui, sans-serif;
  --f-ui:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050707; --key:#1a1f1e; --key2:#2a302f; --fg:#eef3f1; --muted:#8d9a96; --line:#2b3331;
  --accent:#1f8f76; --accent-fg:#ffffff; --danger:#ff7468;
  --b0:#4fd1ad; --b1:#eef3f1; --b2:#f2c35e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#050707; --key:#1a1f1e; --key2:#2a302f; --fg:#eef3f1; --muted:#8d9a96; --line:#2b3331;
  --accent:#1f8f76; --accent-fg:#ffffff; --danger:#ff7468;
  --b0:#4fd1ad; --b1:#eef3f1; --b2:#f2c35e; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit}
.app{height:100%;max-width:min(460px, 58vh);min-width:0;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(26px, env(safe-area-inset-left, 0px));padding-right:max(26px, env(safe-area-inset-right, 0px));padding-block:10px 14px}

/* Icon bar */
.bar{display:flex;align-items:center;gap:6px;padding-top:10px;margin-left:-10px}
.ib{width:48px;height:48px;border:0;border-radius:14px;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
@media (hover:hover){.ib:hover{background:var(--key)}}
.ib svg{width:28px;height:28px}
.grow{flex:1}

/* Display */
.display{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:clamp(6px,2.5vh,24px) 0 clamp(10px,4.5vh,40px);overflow:hidden}
.expr{font-family:var(--f-num);font-weight:300;flex:0 1 auto;text-align:right;line-height:1.18;word-break:normal;overflow-wrap:normal;overflow-y:auto;min-height:1.25em;font-variant-numeric:tabular-nums;outline:none;caret-color:var(--b0);-webkit-touch-callout:none;-webkit-user-select:text;user-select:text;white-space:pre-wrap}
.expr::selection,.expr *::selection{background:color-mix(in srgb, var(--b0) 35%, transparent)}
.expr .op{color:var(--b0)}
.n{white-space:nowrap}
.expr .b0{color:var(--b0)} .expr .b1{color:var(--b1)} .expr .b2{color:var(--b2)}
.expr .un{color:var(--muted)}
.expr.empty{min-width:1px}
.preview{flex:0 0 auto;font-family:var(--f-num);font-weight:300;font-size:min(30px, 7vw);color:var(--muted);text-align:right;min-height:1.3em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.preview.err{color:var(--danger);font-family:var(--f-ui);font-size:1.05rem;font-weight:600}

/* Keypad */
.pad{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.keys{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.key{border:0;border-radius:999px;aspect-ratio:1;min-width:0;background:var(--key);color:var(--fg);font:400 clamp(1.4rem,3.7vh,2.05rem) var(--f-num);
  display:grid;place-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .07s, background .12s}
@media (hover:hover){.key:hover{filter:brightness(1.1)}}
.key:active{transform:scale(.93)}
.key svg{width:42%;height:42%}
.key.opk{background:var(--key2)}
.key.red{color:var(--danger)}
.key.eq{background:var(--accent);color:var(--accent-fg)}
.ib:focus-visible,.key:focus-visible,.pill:focus-visible{outline:2px solid var(--b0);outline-offset:2px}

/* History beside the operator column */
.history{position:absolute;left:0;top:0;bottom:0;width:calc((100% - 3 * var(--gap)) * .75 + 2 * var(--gap));
  border-right:1px solid var(--line);padding-right:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.app.hist-open .keys .key:not(.col4){visibility:hidden}
.hlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;scrollbar-width:thin}
.hday{font:700 .7rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 0 0}
.hrow{display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:11px 0;cursor:pointer;border-radius:10px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
@media (hover:hover){.hrow:hover{background:var(--key)}}
.hrow:active{background:var(--key)}
.hx{color:var(--fg);font-size:clamp(1.05rem,2.6vh,1.4rem);letter-spacing:-.01em;text-align:right;overflow-wrap:normal;line-height:1.28}
.hr{color:var(--b0);font-size:clamp(1.3rem,3vh,1.6rem);letter-spacing:-.01em;text-align:right;white-space:nowrap;max-width:100%}
.hempty{margin:auto 0;color:var(--muted);text-align:center;font-size:.92rem;line-height:1.5;padding:0 8px}
.bar .tools{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.ib.on{color:var(--b0)}
.ib.on::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--b0)}
.ib{position:relative}
.qwrap{flex:1;min-width:0;display:flex;align-items:center;background:var(--key);border-radius:999px;padding:0 4px 0 14px;height:42px}
.qwrap input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:600 .95rem var(--f-ui);outline:none;padding:0}
.qwrap input::placeholder{color:var(--muted);font-weight:500}
.qwrap input::-webkit-search-cancel-button{display:none}
.qx{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.qx svg{width:18px;height:18px}
.hfilter{display:flex;align-items:center;gap:8px;justify-content:space-between;font:600 .74rem var(--f-ui);color:var(--muted);padding:2px 0 6px;border-bottom:1px dashed var(--line)}
.hfilter span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hfilter button{flex:0 0 auto;border:0;background:var(--key);color:var(--fg);border-radius:999px;padding:5px 10px;font:700 .72rem var(--f-ui);cursor:pointer}
.hlabel mark{background:color-mix(in srgb, var(--b2) 30%, transparent);color:inherit;border-radius:3px;padding:0 1px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{flex:1;text-align:center}
.calnav{width:40px;height:40px;border:0;border-radius:50%;background:var(--bg);color:var(--fg);font:600 1.3rem var(--f-ui);cursor:pointer;display:grid;place-items:center}
.calnav:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font:700 .68rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{position:relative;aspect-ratio:1;border:0;border-radius:50%;background:none;color:var(--fg);font:500 .95rem var(--f-num);cursor:pointer;display:grid;place-items:center;font-variant-numeric:tabular-nums;min-width:0}
.cal .d:disabled{color:var(--muted);opacity:.4;cursor:default}
.cal .d.today{outline:1.5px solid var(--line)}
.cal .d.has::after{content:"";position:absolute;bottom:14%;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--b0)}
.cal .d.sel{background:var(--accent);color:var(--accent-fg)}
.cal .d.sel::after{background:var(--accent-fg)}
.calnote{font:500 .78rem var(--f-ui);color:var(--muted);text-align:center}
.app.kb-on .pad{display:none}
.app.kb-on .display{padding-bottom:8px}
.kbhint{font:600 .78rem var(--f-ui);color:var(--muted);text-align:center;padding:6px 0 2px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;justify-content:space-between;border:0;border-radius:12px;padding:12px 14px;background:var(--bg);color:var(--fg);font:600 .95rem var(--f-ui);cursor:pointer;text-align:left}
.opt.sel{outline:2px solid var(--b0);color:var(--b0)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.range label{display:flex;flex-direction:column;gap:4px;font:700 .72rem var(--f-ui);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.range input{padding:10px;font-size:.9rem;min-width:0}
.hfoot{display:flex;flex-direction:column;align-items:center;gap:8px}
.pill{border:0;border-radius:999px;padding:14px 26px;background:var(--key2);color:var(--fg);font:700 1rem var(--f-ui);cursor:pointer;max-width:100%}
.pill.danger{background:var(--danger);color:#fff}
.confirm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--muted);text-align:center}
.confirm .pill{padding:11px 18px;font-size:.9rem}
.more{text-align:center;color:var(--muted);font-size:.75rem;padding:6px}

.hlabel{align-self:flex-start;max-width:100%;display:flex;align-items:center;gap:5px;color:var(--b2);font:700 .9rem var(--f-ui);letter-spacing:.01em;line-height:1.2;padding-bottom:3px;overflow-wrap:anywhere}
.hlabel svg{flex:0 0 auto;width:14px;height:14px}
.sheet{position:fixed;inset:0;z-index:35;background:rgb(0 0 0 / .45);display:flex;justify-content:center;align-items:flex-start;padding:16vh max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px))}
.sheet .card{width:min(360px,100%);background:var(--key);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgb(0 0 0 / .4)}
.sheet h2{margin:0;font:700 1.05rem var(--f-ui);color:var(--fg)}
.sheet .calc{font:400 .9rem var(--f-num);color:var(--muted);overflow-wrap:anywhere}
.sheet input{width:100%;color-scheme:inherit;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:600 1rem var(--f-ui)}
.sheet input:focus{outline:none;border-color:var(--b0)}
.sheet .row{display:flex;justify-content:flex-end;gap:8px}
.sheet .row .pill{padding:11px 20px;font-size:.92rem}
.pill.save{background:var(--accent);color:var(--accent-fg)}
.pop{position:fixed;z-index:30;background:var(--key2);border-radius:14px;padding:4px;display:flex;box-shadow:0 8px 24px rgb(0 0 0 / .35)}
.pop button{border:0;background:none;color:var(--fg);font:600 1rem var(--f-ui);padding:12px 18px;border-radius:10px;cursor:pointer}
.pop button:hover{background:var(--key)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(16px);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font:600 .85rem var(--f-ui);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="bar">
    <button class="ib" id="histBtn" type="button" aria-label="Show history"></button>
    <div class="tools" id="histTools" hidden>
      <button class="ib" id="searchBtn" type="button" aria-label="Search labels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      </button>
      <div class="qwrap" id="qwrap" hidden>
        <input id="q" type="search" placeholder="Search labels" autocomplete="off" aria-label="Search labels">
        <button class="qx" id="qClose" type="button" aria-label="Close search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <button class="ib" id="dateBtn" type="button" aria-label="Pick a date">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.6"/></svg>
      </button>
    </div>
      </div>

  <section class="display" id="display" aria-live="polite">
    <div class="expr empty" id="expr" contenteditable="true" inputmode="none" spellcheck="false" autocorrect="off" autocapitalize="off" role="textbox" aria-label="Calculation"></div>
    <div class="preview" id="preview"></div>
    <div class="kbhint" id="kbhint" hidden>Use your keyboard's clipboard to paste. Press Back for the keypad.</div>
  </section>

  <div class="pad">
    <div class="keys" id="keys">
      <aside class="history" id="history" hidden aria-label="Calculation history">
        <div class="hfilter" id="hfilter" hidden></div>
        <div class="hlist" id="hlist"></div>
        <div class="hfoot" id="hfoot"></div>
      </aside>
    </div>
  </div>
</div>
<div class="pop" id="pop" hidden role="menu"></div>
<div class="sheet" id="sheet" hidden>
  <form class="card" id="labelForm" role="dialog" aria-modal="true" aria-labelledby="labelTitle">
    <h2 id="labelTitle">Label this calculation</h2>
    <div class="calc" id="labelCalc"></div>
    <input id="labelInput" type="text" maxlength="40" autocomplete="off" placeholder="e.g. Rent for March" aria-label="Label name">
    <div class="row"><button class="pill" type="button" id="labelCancel">Cancel</button><button class="pill save" type="submit">Save</button></div>
  </form>
</div>
<div class="sheet" id="dateSheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="calTitle">
    <div class="calhead">
      <button class="calnav" type="button" id="calPrev" aria-label="Previous month">‹</button>
      <h2 id="calTitle"></h2>
      <button class="calnav" type="button" id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="cal" id="calGrid"></div>
    <div class="calnote">Days with a dot have calculations</div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const OPS = "+−×÷^";
const FUNCS = ["sin⁻¹","cos⁻¹","tan⁻¹","sin","cos","tan","ln","log","abs"];
const ICON_HIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M5.5 2.8v3.6h3.6"/><path d="M12 7.5V12l3 2"/></svg>';
const ICON_PAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="2.5" width="15" height="19" rx="3"/><rect x="7.5" y="5.5" width="9" height="4" rx="1"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01" stroke-width="2.4"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>';
let expr = "", justEval = false, deg = true, inv = false;

/* ---------- Evaluator ---------- */
function tokenize(s){
  const t = []; let i = 0;
  while (i < s.length){
    const c = s[i];
    if (/[\d.]/.test(c)){ let j=i; while (j<s.length && /[\d.]/.test(s[j])) j++; const n=s.slice(i,j);
      if ((n.match(/\./g)||[]).length>1 || n===".") throw 0; t.push({k:"n",v:parseFloat(n)}); i=j; continue; }
    const f = FUNCS.find(f => s.startsWith(f,i));
    if (f){ t.push({k:"f",v:f}); i+=f.length; continue; }
    if (c==="√"){ t.push({k:"f",v:"√"}); i++; continue; }
    if (c==="π"){ t.push({k:"n",v:Math.PI}); i++; continue; }
    if (c==="e"){ t.push({k:"n",v:Math.E}); i++; continue; }
    if ("+−×÷^()%!".includes(c)){ t.push({k:c}); i++; continue; }
    throw 0;
  }
  return t;
}
function evaluate(s){
  const t = tokenize(s); let p = 0, lastPct = false;
  const peek = () => t[p], eat = k => (t[p] && t[p].k===k) ? t[p++] : null;
  const toR = x => deg ? x*Math.PI/180 : x, fromR = x => deg ? x*180/Math.PI : x;
  const clean = x => Math.abs(x)<1e-13 ? 0 : x;
  const F = {
    "sin": x=>clean(Math.sin(toR(x))), "cos": x=>clean(Math.cos(toR(x))),
    "tan": x=>{ if(clean(Math.cos(toR(x)))===0) throw 0; return clean(Math.tan(toR(x))); },
    "sin⁻¹": x=>{ if(Math.abs(x)>1) throw 0; return fromR(Math.asin(x)); },
    "cos⁻¹": x=>{ if(Math.abs(x)>1) throw 0; return fromR(Math.acos(x)); },
    "tan⁻¹": x=>fromR(Math.atan(x)),
    "ln": x=>{ if(x<=0) throw 0; return Math.log(x); }, "log": x=>{ if(x<=0) throw 0; return Math.log10(x); },
    "abs": Math.abs, "√": x=>{ if(x<0) throw 0; return Math.sqrt(x); }
  };
  function fact(n){ if(n<0||!Number.isInteger(n)||n>170) throw 0; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
  function primary(){
    const tk = peek(); if(!tk) throw 0;
    if (tk.k==="n"){ p++; return tk.v; }
    if (eat("(")){ const v=expr(); if(!eat(")")) throw 0; return v; }
    if (tk.k==="f"){ p++; return F[tk.v](unary()); }
    throw 0;
  }
  function postfix(){ let v = primary(); lastPct=false;
    for(;;){ if(eat("!")){ v=fact(v); lastPct=false; } else if(eat("%")){ v=v/100; lastPct=true; } else break; }
    return v; }
  function power(){ let b = postfix(); if (eat("^")){ const e=unary(); lastPct=false; b=Math.pow(b,e); } return b; }
  function unary(){ if (eat("−")) return -unary(); if (eat("+")) return unary(); return power(); }
  function term(){ let v = unary(), pct = lastPct;
    for(;;){ const tk=peek(); if(!tk) break;
      if (tk.k==="×"){ p++; v*=unary(); pct=false; }
      else if (tk.k==="÷"){ p++; const d=unary(); if(d===0) throw "div0"; v/=d; pct=false; }
      else if (tk.k==="n"||tk.k==="f"||tk.k==="("){ v*=unary(); pct=false; }
      else break; }
    return {v,pct}; }
  function expr(){ let v = term().v;
    for(;;){ if (eat("+")){ const r=term(); v = r.pct ? v + v*r.v : v + r.v; }
      else if (eat("−")){ const r=term(); v = r.pct ? v - v*r.v : v - r.v; }
      else break; }
    return v; }
  const v = expr(); if (p<t.length) throw 0; if (!isFinite(v)) throw "big"; return v;
}
const openCount = s => (s.match(/\(/g)||[]).length - (s.match(/\)/g)||[]).length;
const closed = s => s + ")".repeat(Math.max(0, openCount(s)));

/* ---------- Formatting ---------- */

  const shownFrom = firstShown;
  renderHistory();
  /* keep older entries that were already loaded, and the scroll position */
  const list = $("hlist");
  while (firstShown > shownFrom){
    const start = Math.max(shownFrom, firstShown - PAGE), frag = document.createDocumentFragment();
    for (let i = start; i < firstShown; i++) frag.appendChild(rowFor(i));
    const note = list.querySelector(".more"); if (note) note.remove();
    firstShown = start; list.insertBefore(frag, list.firstChild);
    if (firstShown > 0) list.insertBefore(moreNote(), list.firstChild);
  }
  fitResults();
  scrollGen++;   // cancel the jump to the newest entry; stay where you were
  list.scrollTop = top;
}
function rowFor(k){
  const h = history[shown[k]], prev = k > 0 ? history[shown[k-1]] : null, frag = document.createDocumentFragment();
  if (!prev || dayKey(prev.ts) !== dayKey(h.ts)){ const d=document.createElement("div"); d.className="hday"; d.textContent=dayLabel(h.ts); frag.appendChild(d); }
  const row = document.createElement("div"); row.className="hrow"; row.setAttribute("role","button"); row.tabIndex = 0;
  row.innerHTML = (h.label ? `<div class="hlabel">${TAG_ICON}<span>${markQuery(h.label)}</span></div>` : "") +
    `<div class="hx">${wrapExpr(h.expr)}</div><div class="hr">=${esc(fmtNum(h.value))}</div>`;
  onLongPress(row, e => {
    const items = [["Copy", () => copyText(e.target.closest(".hx") ? plainExpr(h.expr) : fmtNum(h.value))],
                   [h.label ? "Edit label" : "Label", () => openLabel(h)]];
    if (h.label) items.push(["Remove label", () => saveLabel(h, "")]);
    return items;
  }, e => {
    closeHistory();
    if (e.target.closest(".hx")) { expr = h.expr; justEval = false; selA = selB = expr.length; ed.focus({ preventScroll:true }); render(); }
    else act(() => { const s = toExprStr(h.value); if (justEval){ expr = ""; justEval = false; } if (endsValue()) expr += "×"; expr += (h.value<0 && expr ? "("+s+")" : s); });
  });
  row.addEventListener("keydown", e => { if (e.key==="Enter"){ e.stopPropagation(); e.preventDefault(); closeHistory(); act(() => { if (justEval){ expr=""; justEval=false; } expr += toExprStr(h.value); }); } });
  frag.appendChild(row);
  return frag;
}
/* ---------- Filters: label search + date range ---------- */
let query = "", dateF = null;   // dateF: {key, label, from, to} with from/to as timestamps
let shown = [];                 // indices into history that pass the filters, oldest first
const filtering = () => !!query || !!dateF;
function applyFilters(){
  const q = query.toLowerCase();
  shown = [];
  for (let i = 0; i < history.length; i++){
    const h = history[i];
    if (q && !(h.label && h.label.toLowerCase().includes(q))) continue;
    if (dateF && (h.ts < dateF.from || h.ts >= dateF.to)) continue;
    shown.push(i);
  }
}
function markQuery(label){
  if (!query) return esc(label);
  const i = label.toLowerCase().indexOf(query.toLowerCase());
  if (i < 0) return esc(label);
  return esc(label.slice(0,i)) + "<mark>" + esc(label.slice(i, i+query.length)) + "</mark>" + esc(label.slice(i+query.length));
}
function renderFilterLine(){
  const f = $("hfilter");
  f.hidden = !filtering();
  if (!filtering()) return;
  const parts = [];
  if (query) parts.push(`“${query}”`);
  if (dateF) parts.push(dateF.label);
  f.innerHTML = `<span>${shown.length.toLocaleString("en-US")} of ${history.length.toLocaleString("en-US")} · ${esc(parts.join(" · "))}</span><button type="button" id="fClear">Clear filters</button>`;
  $("fClear").onclick = () => { clearFilters(); renderHistory(); };
}
function renderHistory(){
  applyFilters(); renderFilterLine();
  const list = $("hlist"); list.innerHTML = "";
  if (!history.length){
    list.innerHTML = `<div class="hempty">No history yet.<br>Every calculation you finish is kept here, with no limit.</div>`;
  } else if (!shown.length){
    list.innerHTML = `<div class="hempty">No calculations match.<br>${query ? "Try another label" : "Try another date"}${query && dateF ? " or date" : ""}.</div>`;
  } else {
    firstShown = Math.max(0, shown.length - PAGE);
    if (firstShown > 0) list.appendChild(moreNote());
    for (let k = firstShown; k < shown.length; k++) list.appendChild(rowFor(k));
    scrollHistoryToEnd();
  }
  renderFoot();
}
function moreNote(){ const m=document.createElement("div"); m.className="more"; m.textContent=`Scroll up for ${firstShown.toLocaleString("en-US")} older`; return m; }
$("hlist").addEventListener("scroll", () => {
  const list = $("hlist");
  if (firstShown > 0 && list.scrollTop < 150){
    const oldH = list.scrollHeight, start = Math.max(0, firstShown - PAGE), frag = document.createDocumentFragment();
    for (let i = start; i < firstShown; i++) frag.appendChild(rowFor(i));
    const note = list.querySelector(".more"); if (note) note.remove();
    firstShown = start;
    list.insertBefore(frag, list.firstChild);
    if (firstShown > 0) list.insertBefore(moreNote(), list.firstChild);
    fitResults();
    list.scrollTop += list.scrollHeight - oldH;
  }
});
function renderFoot(){
  const f = $("hfoot"), n = history.length.toLocaleString("en-US");
  if (filtering() && !confirming){ f.innerHTML = ""; return; }
  if (confirming){
    f.innerHTML = `<div class="confirm"><span style="flex-basis:100%">Delete all ${n} calculations?</span><button class="pill" type="button" id="hno">Cancel</button><button class="pill danger" type="button" id="hyes">Delete</button></div>`;
    $("hno").onclick = () => { confirming=false; renderFoot(); };
    $("hyes").onclick = () => { confirming=false; clearHistory(); };
  } else if (history.length){
    f.innerHTML = `<button class="pill" type="button" id="hclear">Clear history</button>`;
    $("hclear").onclick = () => { confirming=true; renderFoot(); };
  } else f.innerHTML = "";
}
function setHistIcon(open){ $("histBtn").innerHTML = open ? ICON_PAD : ICON_HIST; $("histBtn").setAttribute("aria-label", open ? "Show keypad" : "Show history"); }
function fitResults(){
  document.querySelectorAll("#hlist .hr:not([data-fit])").forEach(el => {
    el.dataset.fit = "1";
    if (el.scrollWidth > el.clientWidth + 1){
      const px = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(12, px * el.clientWidth / el.scrollWidth * 0.98).toFixed(1) + "px";
    }
  });
}
let scrollGen = 0;
function scrollHistoryToEnd(){
  const list = $("hlist"), gen = ++scrollGen;
  const go = () => { fitResults(); if (gen === scrollGen) list.scrollTop = list.scrollHeight; };
  go(); requestAnimationFrame(() => { go(); requestAnimationFrame(go); });
  setTimeout(go, 120);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
}
function openHistory(){ exitKbMode(); $("history").hidden=false; $("app").classList.add("hist-open"); $("histTools").hidden=false; setHistIcon(true); confirming=false; renderHistory(); }
function closeHistory(){ $("history").hidden=true; $("app").classList.remove("hist-open"); $("histTools").hidden=true; closeSearch(); clearFilters(); setHistIcon(false); }
function clearFilters(){ query = ""; $("q").value = ""; dateF = null; $("searchBtn").classList.remove("on"); $("dateBtn").classList.remove("on"); }

/* Search: filters by label as you type */
function openSearch(){ $("qwrap").hidden = false; $("searchBtn").hidden = true; $("q").focus(); }
function closeSearch(){ $("qwrap").hidden = true; $("searchBtn").hidden = false; $("q").blur(); }
$("searchBtn").onclick = openSearch;
$("q").addEventListener("input", () => { query = $("q").value.trim(); $("searchBtn").classList.toggle("on", !!query); renderHistory(); });
$("q").addEventListener("keydown", e => { if (e.key === "Escape"){ e.preventDefault(); if ($("q").value){ $("q").value = ""; query = ""; renderHistory(); } else closeSearch(); } else if (e.key === "Enter"){ e.preventDefault(); $("q").blur(); } });
$("qClose").addEventListener("pointerdown", e => e.preventDefault());
$("qClose").onclick = () => { $("q").value = ""; query = ""; $("searchBtn").classList.remove("on"); closeSearch(); renderHistory(); };

/* Date filter: pick one day on a month calendar */
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const addDays = (t, n) => { const x = new Date(t); x.setDate(x.getDate() + n); return x.getTime(); };
let calMonth = null, daysWithCalcs = new Set();
function setDate(f){ dateF = f; $("dateBtn").classList.toggle("on", !!f); $("dateSheet").hidden = true; renderHistory(); }
function renderCal(){
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), today = dayStart(Date.now());
  $("calTitle").textContent = calMonth.toLocaleDateString(undefined, { month:"long", year:"numeric" });
  const now = new Date();
  $("calNext").disabled = y > now.getFullYear() || (y === now.getFullYear() && m >= now.getMonth());
  const grid = $("calGrid"); grid.innerHTML = "";
  const monday = new Date(2024, 0, 1);   // a Monday, for weekday names
  for (let k = 0; k < 7; k++){ const w = document.createElement("div"); w.className = "wd"; w.textContent = new Date(monday.getTime() + k*864e5).toLocaleDateString(undefined, { weekday:"narrow" }); grid.appendChild(w); }
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;   // weeks start on Monday
  for (let k = 0; k < lead; k++) grid.appendChild(document.createElement("div"));
  const days = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= days; d++){
    const t = new Date(y, m, d).getTime(), b = document.createElement("button");
    b.type = "button"; b.className = "d"; b.textContent = d;
    b.setAttribute("aria-label", new Date(t).toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"long", year:"numeric" }));
    if (t > today) b.disabled = true;
    if (t === today) b.classList.add("today");
    if (daysWithCalcs.has(dayKey(t))) b.classList.add("has");
    if (dateF && dateF.from === t) { b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); }
    b.onclick = () => setDate({ key: "day", from: t, to: addDays(t, 1),
      label: new Date(t).toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short", year:"numeric" }) });
    grid.appendChild(b);
  }
}
function openDateSheet(){
  daysWithCalcs = new Set(history.map(h => dayKey(h.ts)));
  const base = dateF ? new Date(dateF.from) : new Date();
  calMonth = new Date(base.getFullYear(), base.getMonth(), 1);
  renderCal();
  $("dateSheet").hidden = false;
}
$("dateBtn").onclick = openDateSheet;
$("calPrev").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() - 1, 1); renderCal(); };
$("calNext").onclick = () => { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 1); renderCal(); };
$("dateSheet").addEventListener("pointerdown", e => { if (e.target === $("dateSheet")) $("dateSheet").hidden = true; });
$("histBtn").addEventListener("click", () => $("history").hidden ? openHistory() : closeHistory());
setHistIcon(false);

let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1600); }

/* Android back button: close the history first, then leave the app */
window.__onBack = () => {
  if (kbMode){ exitKbMode(); return true; }
  if (!$("sheet").hidden){ closeLabel(); return true; }
  if (!$("dateSheet").hidden){ $("dateSheet").hidden = true; return true; }
  if (!$("qwrap").hidden){ closeSearch(); return true; }
  if (!$("pop").hidden){ $("pop").hidden = true; return true; }
  if (!$("history").hidden){ closeHistory(); return true; }
  return false;
};

addEventListener("resize", () => fitSize(plainExpr(expr||"0")));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSize(plainExpr(expr||"0")));

render(); loadHistory();
})();
</script>
