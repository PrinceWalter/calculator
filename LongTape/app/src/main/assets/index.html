<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script>
/* The app passes the phone's light/dark setting in the address so colours match from the first frame */
try { var t = new URLSearchParams(location.search).get("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<title>Long Tape Calculator</title>
<style>
@font-face{font-family:"Sora";font-weight:300;font-style:normal;font-display:swap;src:url("fonts/sora-latin-300-normal.woff2") format("woff2")}
@font-face{font-family:"Sora";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/sora-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Sora";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/sora-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-700-normal.woff2") format("woff2")}
*{box-sizing:border-box}
body{margin:0;font-size:14px}
/* Layout: icon bar, expression + live result, round 4-column keypad; history takes the left three columns beside the operators. */
:root{
  --bg:#f4f6f5; --key:#e3e8e6; --key2:#d4dcd9; --fg:#121a18; --muted:#6b7975; --line:#cfd8d5;
  --accent:#17866d; --accent-fg:#ffffff; --danger:#d0483c;
  --b0:#17866d; --b1:#121a18; --b2:#b7791f;
  --gap:12px;
  --f-num:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-ui:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050707; --key:#1a1f1e; --key2:#2a302f; --fg:#eef3f1; --muted:#8d9a96; --line:#2b3331;
  --accent:#1f8f76; --accent-fg:#ffffff; --danger:#ff7468;
  --b0:#4fd1ad; --b1:#eef3f1; --b2:#f2c35e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#050707; --key:#1a1f1e; --key2:#2a302f; --fg:#eef3f1; --muted:#8d9a96; --line:#2b3331;
  --accent:#1f8f76; --accent-fg:#ffffff; --danger:#ff7468;
  --b0:#4fd1ad; --b1:#eef3f1; --b2:#f2c35e; color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font-family:inherit}
.app{height:100%;max-width:min(460px, 58vh);min-width:0;margin:0 auto;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px 14px}

/* Icon bar */
.bar{display:flex;align-items:center;gap:6px;padding-top:6px}
.ib{width:48px;height:48px;border:0;border-radius:14px;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer}
@media (hover:hover){.ib:hover{background:var(--key)}}
.ib svg{width:28px;height:28px}
.grow{flex:1}

/* Display */
.display{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,4vh,48px);padding:clamp(12px,6vh,72px) 6px 16px;overflow:hidden}
.expr{font-family:var(--f-num);font-weight:300;text-align:right;line-height:1.18;word-break:normal;overflow-wrap:normal;overflow-y:auto;min-height:1.25em;font-variant-numeric:tabular-nums;outline:none;caret-color:var(--b0);-webkit-touch-callout:none;-webkit-user-select:text;user-select:text;white-space:pre-wrap}
.expr::selection,.expr *::selection{background:color-mix(in srgb, var(--b0) 35%, transparent)}
.expr .op{color:var(--b0)}
.n{white-space:nowrap}
.expr .b0{color:var(--b0)} .expr .b1{color:var(--b1)} .expr .b2{color:var(--b2)}
.expr .un{color:var(--muted)}
.expr.empty:empty::before{content:"0";color:var(--muted)}
.preview{font-family:var(--f-num);font-weight:300;font-size:clamp(1.4rem,4vh,2rem);color:var(--muted);text-align:right;min-height:1.3em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.preview.err{color:var(--danger);font-family:var(--f-ui);font-size:1.05rem;font-weight:600}

/* Keypad */
.pad{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--gap)}
.keys{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.key{border:0;border-radius:999px;aspect-ratio:1;min-width:0;background:var(--key);color:var(--fg);font:300 clamp(1.5rem,4.2vh,2.2rem) var(--f-num);
  display:grid;place-items:center;cursor:pointer;-webkit-user-select:none;user-select:none;transition:transform .07s, background .12s}
@media (hover:hover){.key:hover{filter:brightness(1.1)}}
.key:active{transform:scale(.93)}
.key svg{width:42%;height:42%}
.key.opk{background:var(--key2)}
.key.red{color:var(--danger)}
.key.eq{background:var(--accent);color:var(--accent-fg)}
.ib:focus-visible,.key:focus-visible,.pill:focus-visible{outline:2px solid var(--b0);outline-offset:2px}

/* History beside the operator column */
.history{position:absolute;left:0;top:0;bottom:0;width:calc((100% - 3 * var(--gap)) * .75 + 2 * var(--gap));
  border-right:1px solid var(--line);padding-right:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.app.hist-open .keys .key:not(.col4){visibility:hidden}
.hlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;scrollbar-width:thin}
.hday{font:700 .62rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 0 0}
.hrow{display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:7px 0;cursor:pointer;border-radius:10px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
@media (hover:hover){.hrow:hover{background:var(--key)}}
.hrow:active{background:var(--key)}
.hx{color:var(--fg);font-size:clamp(.88rem,1.9vh,1rem);letter-spacing:-.01em;text-align:right;overflow-wrap:normal;line-height:1.28}
.hr{color:var(--b0);font-size:clamp(1.08rem,2.5vh,1.25rem);letter-spacing:-.01em;text-align:right;overflow-wrap:anywhere}
.hempty{margin:auto 0;color:var(--muted);text-align:center;font-size:.92rem;line-height:1.5;padding:0 8px}
.hfoot{display:flex;flex-direction:column;align-items:center;gap:8px}
.pill{border:0;border-radius:999px;padding:14px 26px;background:var(--key2);color:var(--fg);font:700 1rem var(--f-ui);cursor:pointer;max-width:100%}
.pill.danger{background:var(--danger);color:#fff}
.confirm{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--muted);text-align:center}
.confirm .pill{padding:11px 18px;font-size:.9rem}
.more{text-align:center;color:var(--muted);font-size:.75rem;padding:6px}

.pop{position:fixed;z-index:30;background:var(--key2);border-radius:14px;padding:4px;display:flex;box-shadow:0 8px 24px rgb(0 0 0 / .35)}
.pop button{border:0;background:none;color:var(--fg);font:600 1rem var(--f-ui);padding:12px 18px;border-radius:10px;cursor:pointer}
.pop button:hover{background:var(--key)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%) translateY(16px);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font:600 .85rem var(--f-ui);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="bar">
    <button class="ib" id="histBtn" type="button" aria-label="Show history"></button>
      </div>

  <section class="display" id="display" aria-live="polite">
    <div class="expr empty" id="expr" contenteditable="true" inputmode="none" spellcheck="false" autocorrect="off" autocapitalize="off" role="textbox" aria-label="Calculation"></div>
    <div class="preview" id="preview"></div>
  </section>

  <div class="pad">
    <div class="keys" id="keys">
      <aside class="history" id="history" hidden aria-label="Calculation history">
        <div class="hlist" id="hlist"></div>
        <div class="hfoot" id="hfoot"></div>
      </aside>
    </div>
  </div>
</div>
<div class="pop" id="pop" hidden role="menu"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const OPS = "+−×÷^";
const FUNCS = ["sin⁻¹","cos⁻¹","tan⁻¹","sin","cos","tan","ln","log","abs"];
const ICON_HIST = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M5.5 2.8v3.6h3.6"/><path d="M12 7.5V12l3 2"/></svg>';
const ICON_PAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="2.5" width="15" height="19" rx="3"/><rect x="7.5" y="5.5" width="9" height="4" rx="1"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01" stroke-width="2.4"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h10.5A1.5 1.5 0 0 1 21 6.5v11a1.5 1.5 0 0 1-1.5 1.5H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>';
let expr = "", justEval = false, deg = true, inv = false;

/* ---------- Evaluator ---------- */
function tokenize(s){
  const t = []; let i = 0;
  while (i < s.length){
    const c = s[i];
    if (/[\d.]/.test(c)){ let j=i; while (j<s.length && /[\d.]/.test(s[j])) j++; const n=s.slice(i,j);
      if ((n.match(/\./g)||[]).length>1 || n===".") throw 0; t.push({k:"n",v:parseFloat(n)}); i=j; continue; }
    const f = FUNCS.find(f => s.startsWith(f,i));
    if (f){ t.push({k:"f",v:f}); i+=f.length; continue; }
    if (c==="√"){ t.push({k:"f",v:"√"}); i++; continue; }
    if (c==="π"){ t.push({k:"n",v:Math.PI}); i++; continue; }
    if (c==="e"){ t.push({k:"n",v:Math.E}); i++; continue; }
    if ("+−×÷^()%!".includes(c)){ t.push({k:c}); i++; continue; }
    throw 0;
  }
  return t;
}
function evaluate(s){
  const t = tokenize(s); let p = 0, lastPct = false;
  const peek = () => t[p], eat = k => (t[p] && t[p].k===k) ? t[p++] : null;
  const toR = x => deg ? x*Math.PI/180 : x, fromR = x => deg ? x*180/Math.PI : x;
  const clean = x => Math.abs(x)<1e-13 ? 0 : x;
  const F = {
    "sin": x=>clean(Math.sin(toR(x))), "cos": x=>clean(Math.cos(toR(x))),
    "tan": x=>{ if(clean(Math.cos(toR(x)))===0) throw 0; return clean(Math.tan(toR(x))); },
    "sin⁻¹": x=>{ if(Math.abs(x)>1) throw 0; return fromR(Math.asin(x)); },
    "cos⁻¹": x=>{ if(Math.abs(x)>1) throw 0; return fromR(Math.acos(x)); },
    "tan⁻¹": x=>fromR(Math.atan(x)),
    "ln": x=>{ if(x<=0) throw 0; return Math.log(x); }, "log": x=>{ if(x<=0) throw 0; return Math.log10(x); },
    "abs": Math.abs, "√": x=>{ if(x<0) throw 0; return Math.sqrt(x); }
  };
  function fact(n){ if(n<0||!Number.isInteger(n)||n>170) throw 0; let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
  function primary(){
    const tk = peek(); if(!tk) throw 0;
    if (tk.k==="n"){ p++; return tk.v; }
    if (eat("(")){ const v=expr(); if(!eat(")")) throw 0; return v; }
    if (tk.k==="f"){ p++; return F[tk.v](unary()); }
    throw 0;
  }
  function postfix(){ let v = primary(); lastPct=false;
    for(;;){ if(eat("!")){ v=fact(v); lastPct=false; } else if(eat("%")){ v=v/100; lastPct=true; } else break; }
    return v; }
  function power(){ let b = postfix(); if (eat("^")){ const e=unary(); lastPct=false; b=Math.pow(b,e); } return b; }
  function unary(){ if (eat("−")) return -unary(); if (eat("+")) return unary(); return power(); }
  function term(){ let v = unary(), pct = lastPct;
    for(;;){ const tk=peek(); if(!tk) break;
      if (tk.k==="×"){ p++; v*=unary(); pct=false; }
      else if (tk.k==="÷"){ p++; const d=unary(); if(d===0) throw "div0"; v/=d; pct=false; }
      else if (tk.k==="n"||tk.k==="f"||tk.k==="("){ v*=unary(); pct=false; }
      else break; }
    return {v,pct}; }
  function expr(){ let v = term().v;
    for(;;){ if (eat("+")){ const r=term(); v = r.pct ? v + v*r.v : v + r.v; }
      else if (eat("−")){ const r=term(); v = r.pct ? v - v*r.v : v - r.v; }
      else break; }
    return v; }
  const v = expr(); if (p<t.length) throw 0; if (!isFinite(v)) throw "big"; return v;
}
const openCount = s => (s.match(/\(/g)||[]).length - (s.match(/\)/g)||[]).length;
const closed = s => s + ")".repeat(Math.max(0, openCount(s)));

/* ---------- Formatting ---------- */
const group = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
function fmtNum(v){
  if (Object.is(v,-0)) v = 0;
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e15 || a < 1e-9)){
    let [m,e] = v.toExponential(9).split("e"); m = m.replace(/\.?0+$/,"");
    return m.replace("-","−") + "E" + e.replace("+","");
  }
  let s = String(parseFloat(v.toPrecision(14)));
  if (s.includes("e")) s = v.toFixed(12).replace(/\.?0+$/,"");
  const neg = s.startsWith("-"); if (neg) s = s.slice(1);
  const [i,d] = s.split(".");
  return (neg?"−":"") + group(i) + (d ? "."+d : "");
}
function toExprStr(v){
  const f = fmtNum(v).replace(/,/g,"");
  if (f.includes("E")){ const [m,e] = f.split("E"); return "("+m+"×10^"+(e.startsWith("-") ? "(−"+e.slice(1)+")" : e)+")"; }
  return f;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const groupNum = n => { const [i,d] = n.split("."); return group(i) + (n.includes(".") ? "."+(d||"") : ""); };
const plainExpr = s => s.replace(/\d+(\.\d*)?/g, groupNum);
const wrapExpr = s => esc(s).replace(/\d+(\.\d*)?/g, m => `<span class="n">${groupNum(m)}</span>`).replace(/[+−×÷^]/g, '<wbr>$&');
/* Bracket pairs share one colour (cycling by depth). A bracket with no partner yet stays grey.
   Also maps positions in the calculation to positions on screen (the screen adds thousands commas). */
function buildView(s){
  const cls = new Array(s.length), stack = [];
  for (let i = 0; i < s.length; i++){
    if (s[i] === "(") stack.push(i);
    else if (s[i] === ")"){
      if (stack.length){ const j = stack.pop(); cls[i] = cls[j] = "b" + (stack.length % 3); } else cls[i] = "un";
    }
  }
  stack.forEach(j => cls[j] = "un");
  let html = "", d = 0, i = 0; const dispOf = [];
  while (i < s.length){
    const c = s[i];
    if (/[\d.]/.test(c)){
      let j = i; while (j < s.length && /[\d.]/.test(s[j])) j++;
      const g = groupNum(s.slice(i,j)); let k = i;
      for (const ch of g){ if (ch !== ",") dispOf[k++] = d; d++; }
      html += `<span class="n">${g}</span>`; i = j; continue;
    }
    dispOf[i] = d++;
    if (c === "(" || c === ")") html += `<span class="${cls[i]}">${c}</span>`;
    else if (OPS.includes(c)) html += `<wbr><span class="op">${c}</span>`;
    else html += esc(c);
    i++;
  }
  dispOf[s.length] = d;
  return { html, dispOf };
}
function rawFromDisp(view, d){ const m = view.dispOf; for (let r = 0; r < m.length; r++) if (m[r] >= d) return r; return m.length - 1; }

/* ---------- Display with cursor ---------- */
const ed = $("expr");
let view = { html:"", dispOf:[0] }, selA = 0, selB = 0;
const measureCtx = document.createElement("canvas").getContext("2d");
function fitSize(text){
  const h = innerHeight, maxPx = Math.min(58, Math.max(40, h * .075)), minPx = Math.min(28, Math.max(22, h * .03));
  const cs = getComputedStyle(ed);
  measureCtx.font = `${cs.fontWeight} ${maxPx}px ${cs.fontFamily}`;
  const w = measureCtx.measureText(text).width, avail = ed.clientWidth - 6;
  const px = w <= avail ? maxPx : Math.max(minPx, maxPx * avail / w);
  ed.style.fontSize = px.toFixed(1) + "px";
}
function domPos(d){
  const w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT); let acc = 0, n;
  while ((n = w.nextNode())){ if (d <= acc + n.length) return [n, d - acc]; acc += n.length; }
  return [ed, ed.childNodes.length];
}
function dispOffset(node, off){ const r = document.createRange(); r.setStart(ed, 0); r.setEnd(node, off); return r.toString().length; }
function placeCaret(){
  if (document.activeElement !== ed) return;
  const sel = getSelection(), r = document.createRange();
  const [n1,o1] = domPos(view.dispOf[Math.min(selA,selB)]), [n2,o2] = domPos(view.dispOf[Math.max(selA,selB)]);
  r.setStart(n1,o1); r.setEnd(n2,o2); sel.removeAllRanges(); sel.addRange(r);
}
function render(){
  const pv = $("preview");
  selA = Math.min(selA, expr.length); selB = Math.min(selB, expr.length);
  view = buildView(expr);
  ed.classList.toggle("empty", !expr);
  ed.innerHTML = view.html;
  fitSize(plainExpr(expr||"0"));
  placeCaret();
  if (Math.max(selA,selB) >= expr.length) ed.scrollTop = ed.scrollHeight;
  pv.classList.remove("err"); pv.textContent = "";
  if (!justEval && /[+−×÷^%!√(a-zπe]/.test(expr.replace(/^−/,""))){
    try { const v = evaluate(closed(expr)); const f = fmtNum(v); if (f !== plainExpr(expr)) pv.textContent = f; } catch(e){}
  }
}
function flashErr(msg){ const pv=$("preview"); pv.textContent = msg; pv.classList.add("err"); }
/* Follow the cursor when it is moved by tapping, dragging or arrow keys */
document.addEventListener("selectionchange", () => {
  const sel = getSelection();
  if (!sel.rangeCount || (sel.anchorNode !== ed && !ed.contains(sel.anchorNode))) return;
  const a = rawFromDisp(view, dispOffset(sel.anchorNode, sel.anchorOffset));
  const b = rawFromDisp(view, dispOffset(sel.focusNode, sel.focusOffset));
  if (a !== selA || b !== selB){ selA = a; selB = b; if (justEval){ justEval = false; } }
});
/* Run an edit at the cursor: the edit sees only the text before the cursor; a selection is replaced. */
function act(fn){
  const a = Math.min(selA,selB), b = Math.max(selA,selB), after = expr.slice(b);
  const hadSel = a !== b;
  if (hadSel) justEval = false;
  expr = expr.slice(0, a);
  if (!(hadSel && fn === back)) fn();
  selA = selB = expr.length;
  expr += after;
  if (ed !== document.activeElement) ed.focus({ preventScroll: true });
  render();
}
function fwdDelete(){
  const a = Math.min(selA,selB), b = Math.max(selA,selB);
  justEval = false;
  expr = expr.slice(0,a) + expr.slice(a === b ? a + 1 : b); selA = selB = a; render();
}
ed.addEventListener("beforeinput", e => e.preventDefault());
ed.addEventListener("drop", e => e.preventDefault());
function cleanPaste(t){
  t = t.trim().replace(/[,\s]/g, "");
  if (/^[-−]?\d+(\.\d+)?[eE][+-]?\d+$/.test(t)) return toExprStr(parseFloat(t.replace("−","-")));
  return t.replace(/[-–—]/g,"−").replace(/[*xX]/g,"×").replace(/[\/:]/g,"÷").replace(/[^\d.+−×÷^()%!πe]/g,"");
}
ed.addEventListener("paste", e => {
  e.preventDefault();
  const t = cleanPaste((e.clipboardData || window.clipboardData).getData("text") || "");
  if (!t){ toast("Nothing to paste. Copy a number or calculation first."); return; }
  act(() => { justEval = false; expr += t; });
});
ed.addEventListener("cut", e => {
  e.preventDefault();
  const text = getSelection().toString(); if (!text) return;
  e.clipboardData.setData("text/plain", text);
  act(() => {});
});

/* ---------- Input ---------- */
const lastCh = () => expr.slice(-1);
const lastNum = () => (expr.match(/[\d.]+$/)||[""])[0];
const endsValue = () => !!expr && /[\d.)%!πe]/.test(lastCh());
function startFresh(){ if (justEval){ expr=""; justEval=false; } }
function digit(d){
  startFresh();
  const n = lastNum();
  if (n.replace(".","").length >= 15){ toast("You can enter up to 15 digits per number"); return; }
  if (n === "0") { expr = expr.slice(0,-1) + d; return; }
  if (!n && endsValue()) expr += "×";
  expr += d;
}
function dot(){
  startFresh();
  const n = lastNum();
  if (n.includes(".")) return;
  if (!n){ if (endsValue()) expr += "×"; expr += "0."; } else expr += ".";
}
function op(o){
  justEval = false;
  if (!expr){ if (o==="−") expr="−"; return; }
  const l = lastCh();
  if (l === "(") { if (o==="−") expr += o; return; }
  if (OPS.includes(l)){
    if (o==="−" && "×÷^".includes(l)){ expr += o; return; }
    expr = expr.replace(/[+−×÷^]+$/,"");
    if (!expr || lastCh()==="(") { if (o==="−") expr += o; return; }
  }
  expr += o;
}
function paren(){ /* closes a bracket when one is open before the cursor and a number ends there; otherwise opens one */
  justEval = false;
  if (openCount(expr) > 0 && endsValue()) expr += ")";
  else { if (endsValue()) expr += "×"; expr += "("; }
}
function percent(){ justEval = false; if (expr && /[\d)πe!]/.test(lastCh())) expr += "%"; }
function insertFn(text){
  const post = /^[\^!%]/.test(text);
  if (post){ justEval = false; if (!endsValue()) return; expr += text; return; }
  startFresh();
  if (endsValue()) expr += "×";
  expr += text;
}
function back(){
  justEval = false;
  const m = expr.match(/(sin⁻¹|cos⁻¹|tan⁻¹|sin|cos|tan|ln|log|abs)\($|√\($|\(−$/);
  expr = m ? expr.slice(0, -m[0].length) : expr.slice(0,-1);
}
function clearAll(){ expr=""; justEval=false; selA = selB = 0; }
function equals(){
  if (!expr || justEval) return;
  const full = closed(expr);
  try {
    const v = evaluate(full);
    addHistory({ expr: full, value: v, ts: Date.now() });
    expr = toExprStr(v); justEval = true; selA = selB = expr.length; render();
  } catch(e){
    render();
    flashErr(e==="div0" ? "Can't divide by 0" : e==="big" ? "Result is too large" : "Invalid format used");
  }
}

/* ---------- Keypad ---------- */
function haptic(){
  try { if (window.AndroidBridge && window.AndroidBridge.haptic) { window.AndroidBridge.haptic(); return; } } catch(e){}
  try { navigator.vibrate && navigator.vibrate(8); } catch(e){}
}
const MAIN = [
  ["C","red",clearAll,"Clear"],
  [ICON_BACK,"red",back,"Delete"],
  ["%","",percent,"Percent"],
  ["÷","opk col4",()=>op("÷"),"Divide"],
  ["7","",null],["8","",null],["9","",null],["×","opk col4",()=>op("×"),"Multiply"],
  ["4","",null],["5","",null],["6","",null],["−","opk col4",()=>op("−"),"Subtract"],
  ["1","",null],["2","",null],["3","",null],["+","opk col4",()=>op("+"),"Add"],
  ["( )","",paren,"Brackets"],["0","",null],[".","",dot,"Decimal point"],["=","eq col4",equals,"Equals"]
];
function mkKey([label, cls, fn, aria]){
  const b = document.createElement("button");
  b.className = "key " + (cls||""); b.type = "button";
  if (label.startsWith("<svg")) b.innerHTML = label; else b.textContent = label;
  if (!fn) fn = () => digit(label);
  if (aria) b.setAttribute("aria-label", aria);
  b.addEventListener("pointerdown", e => { e.preventDefault(); haptic(); });
  b.addEventListener("click", () => {
    if (fn === equals) equals();
    else if (fn === clearAll){ clearAll(); if (ed !== document.activeElement) ed.focus({ preventScroll:true }); render(); }
    else act(fn);
  });
  return b;
}
const keysEl = $("keys");
MAIN.forEach(k => keysEl.insertBefore(mkKey(k), $("history")));
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // copy, paste and select-all work normally
  const k = e.key; let f = null;
  if (/^\d$/.test(k)) f = () => digit(k);
  else if (k===".") f = dot;
  else if (k==="+") f = () => op("+"); else if (k==="-") f = () => op("−"); else if (k==="*"||k==="x") f = () => op("×"); else if (k==="/") f = () => op("÷"); else if (k==="^") f = () => op("^");
  else if (k==="(") f = () => { justEval=false; if (endsValue()) expr+="×"; expr+="("; };
  else if (k===")") f = () => { if (openCount(expr) > 0 && endsValue()) expr+=")"; };
  else if (k==="%") f = percent; else if (k==="!") f = () => insertFn("!");
  else if (k==="Backspace") f = back;
  if (f){ e.preventDefault(); act(f); return; }
  if (k==="Enter"||k==="="){ e.preventDefault(); equals(); }
  else if (k==="Escape"){ e.preventDefault(); clearAll(); render(); }
  else if (k==="Delete"){ e.preventDefault(); fwdDelete(); }
});

/* ---------- Copy (long-press) ---------- */
function copyText(text){
  const plain = text.replace(/,/g,"").replace(/−/g,"-").replace(/^=\s*/,"");
  if (window.AndroidBridge){ try { window.AndroidBridge.copy(plain); toast("Copied"); } catch(e){} return; }
  if (navigator.clipboard) navigator.clipboard.writeText(plain).then(() => toast("Copied"), () => toast("Couldn't copy here"));
}
/* Small menu shown on long-press: items are [label, action] */
function showMenu(x, y, items){
  const p = $("pop"); p.innerHTML = "";
  items.forEach(([label, fn]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.setAttribute("role","menuitem");
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.onclick = () => { p.hidden = true; fn(); }; p.appendChild(b); });
  p.hidden = false;
  const w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w/2)) + "px";
  p.style.top = Math.max(8, y - h - 18) + "px";
}
function showPop(x, y, text){ showMenu(x, y, [["Copy", () => copyText(text)]]); }
document.addEventListener("pointerdown", e => { if (!$("pop").hidden && !$("pop").contains(e.target)) $("pop").hidden = true; }, true);
/* Paste from the phone's clipboard at the cursor */
function insertPasted(raw){
  const t = cleanPaste(raw || "");
  if (!t){ toast("The clipboard has no number or calculation to paste"); return; }
  act(() => { justEval = false; expr += t; });
}
function pasteFromClipboard(){
  try { if (window.AndroidBridge && window.AndroidBridge.readClipboard){ insertPasted(window.AndroidBridge.readClipboard()); return; } } catch(e){}
  if (navigator.clipboard && navigator.clipboard.readText)
    navigator.clipboard.readText().then(insertPasted, () => toast("Your browser blocks pasting from this menu. Press Ctrl+V instead."));
  else toast("Press Ctrl+V to paste");
}
function copyFromDisplay(){
  const a = Math.min(selA,selB), b = Math.max(selA,selB);
  const part = a !== b ? expr.slice(a,b) : expr;
  if (!part){ toast("Nothing to copy yet"); return; }
  copyText(plainExpr(part));
}
/* Long-press the calculation for Paste / Copy (a tap still places the cursor) */
(() => {
  let timer = null, sx = 0, sy = 0;
  const open = () => { timer = null; haptic(); ed.focus({ preventScroll:true });
    const items = [["Paste", pasteFromClipboard]];
    if (expr) items.push([selA !== selB ? "Copy" : "Copy all", copyFromDisplay]);
    showMenu(sx, sy, items); };
  ed.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; clearTimeout(timer); timer = setTimeout(open, 450); });
  ed.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX-sx, e.clientY-sy) > 10){ clearTimeout(timer); timer = null; } });
  ["pointerup","pointercancel"].forEach(t => ed.addEventListener(t, () => { clearTimeout(timer); timer = null; }));
  ed.addEventListener("contextmenu", e => { e.preventDefault(); if (timer){ clearTimeout(timer); open(); } else if ($("pop").hidden){ sx = e.clientX; sy = e.clientY; open(); } });
})();
function onLongPress(el, getText, onTap){
  let timer = null, sx = 0, sy = 0, fired = false;
  el.addEventListener("pointerdown", e => { fired=false; sx=e.clientX; sy=e.clientY;
    timer = setTimeout(() => { fired = true; const t = getText(e); if (t) showPop(sx, sy, t); }, 480); });
  el.addEventListener("pointermove", e => { if (timer && Math.hypot(e.clientX-sx, e.clientY-sy) > 10){ clearTimeout(timer); timer=null; } });
  const end = () => { clearTimeout(timer); timer=null; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); el.addEventListener("pointerleave", end);
  el.addEventListener("contextmenu", e => e.preventDefault());
  el.addEventListener("click", e => { if (fired){ e.preventDefault(); return; } if (onTap) onTap(e); });
}

/* ---------- History (IndexedDB, no limit) ---------- */
let history = [];   // oldest first
let db = null, persistent = false;
function openDB(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("long-tape-calc", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("history", { keyPath: "id", autoIncrement: true });
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch(e){ res(null); }
  });
}
const store = mode => db.transaction("history", mode).objectStore("history");
async function loadHistory(){
  db = await openDB();
  if (!db) return;
  persistent = true;
  try { const r = store("readonly").getAll(); r.onsuccess = () => { history = r.result || []; if (!$("history").hidden) renderHistory(); }; } catch(e){}
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
}
function addHistory(entry){
  if (db){ try { const r = store("readwrite").add(entry); r.onsuccess = () => { entry.id = r.result; }; } catch(e){} }
  history.push(entry);
  if (!$("history").hidden) renderHistory();
}
function clearHistory(){
  if (db){ try { store("readwrite").clear(); } catch(e){} }
  history = []; renderHistory(); toast("History cleared");
}
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function dayLabel(ts){
  const t = new Date(); t.setHours(0,0,0,0); const d = new Date(ts); const dd = new Date(ts); dd.setHours(0,0,0,0);
  const diff = Math.round((t-dd)/864e5);
  if (diff===0) return "Today"; if (diff===1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short", year: d.getFullYear()===t.getFullYear()?undefined:"numeric" });
}
const PAGE = 120; let firstShown = 0, confirming = false;
function rowFor(i){
  const h = history[i], frag = document.createDocumentFragment();
  if (i===0 || dayKey(history[i-1].ts) !== dayKey(h.ts)){ const d=document.createElement("div"); d.className="hday"; d.textContent=dayLabel(h.ts); frag.appendChild(d); }
  const row = document.createElement("div"); row.className="hrow"; row.setAttribute("role","button"); row.tabIndex = 0;
  row.innerHTML = `<div class="hx">${wrapExpr(h.expr)}</div><div class="hr">=${esc(fmtNum(h.value))}</div>`;
  onLongPress(row, e => e.target.closest(".hx") ? plainExpr(h.expr) : fmtNum(h.value), e => {
    closeHistory();
    if (e.target.closest(".hx")) { expr = h.expr; justEval = false; selA = selB = expr.length; ed.focus({ preventScroll:true }); render(); }
    else act(() => { const s = toExprStr(h.value); if (justEval){ expr = ""; justEval = false; } if (endsValue()) expr += "×"; expr += (h.value<0 && expr ? "("+s+")" : s); });
  });
  row.addEventListener("keydown", e => { if (e.key==="Enter"){ e.stopPropagation(); e.preventDefault(); closeHistory(); act(() => { if (justEval){ expr=""; justEval=false; } expr += toExprStr(h.value); }); } });
  frag.appendChild(row);
  return frag;
}
function renderHistory(){
  const list = $("hlist"); list.innerHTML = "";
  if (!history.length){
    list.innerHTML = `<div class="hempty">No history yet.<br>Every calculation you finish is kept here, with no limit.</div>`;
  } else {
    firstShown = Math.max(0, history.length - PAGE);
    if (firstShown > 0) list.appendChild(moreNote());
    for (let i = firstShown; i < history.length; i++) list.appendChild(rowFor(i));
    list.scrollTop = list.scrollHeight;
  }
  renderFoot();
}
function moreNote(){ const m=document.createElement("div"); m.className="more"; m.textContent=`Scroll up for ${firstShown.toLocaleString("en-US")} older`; return m; }
$("hlist").addEventListener("scroll", () => {
  const list = $("hlist");
  if (firstShown > 0 && list.scrollTop < 150){
    const oldH = list.scrollHeight, start = Math.max(0, firstShown - PAGE), frag = document.createDocumentFragment();
    for (let i = start; i < firstShown; i++) frag.appendChild(rowFor(i));
    const note = list.querySelector(".more"); if (note) note.remove();
    firstShown = start;
    list.insertBefore(frag, list.firstChild);
    if (firstShown > 0) list.insertBefore(moreNote(), list.firstChild);
    list.scrollTop += list.scrollHeight - oldH;
  }
});
function renderFoot(){
  const f = $("hfoot"), n = history.length.toLocaleString("en-US");
  if (confirming){
    f.innerHTML = `<div class="confirm"><span style="flex-basis:100%">Delete all ${n} calculations?</span><button class="pill" type="button" id="hno">Cancel</button><button class="pill danger" type="button" id="hyes">Delete</button></div>`;
    $("hno").onclick = () => { confirming=false; renderFoot(); };
    $("hyes").onclick = () => { confirming=false; clearHistory(); };
  } else if (history.length){
    f.innerHTML = `<button class="pill" type="button" id="hclear">Clear history</button>`;
    $("hclear").onclick = () => { confirming=true; renderFoot(); };
  } else f.innerHTML = "";
}
function setHistIcon(open){ $("histBtn").innerHTML = open ? ICON_PAD : ICON_HIST; $("histBtn").setAttribute("aria-label", open ? "Show keypad" : "Show history"); }
function openHistory(){ $("history").hidden=false; $("app").classList.add("hist-open"); setHistIcon(true); confirming=false; renderHistory(); }
function closeHistory(){ $("history").hidden=true; $("app").classList.remove("hist-open"); setHistIcon(false); }
$("histBtn").addEventListener("click", () => $("history").hidden ? openHistory() : closeHistory());
setHistIcon(false);

let tt; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),1600); }

/* Android back button: close the history first, then leave the app */
window.__onBack = () => {
  if (!$("pop").hidden){ $("pop").hidden = true; return true; }
  if (!$("history").hidden){ closeHistory(); return true; }
  return false;
};

addEventListener("resize", () => fitSize(plainExpr(expr||"0")));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitSize(plainExpr(expr||"0")));

render(); loadHistory();
})();
</script>
